[project]
name = "grader-knowledge"
version = "0.1.0"
description = "Synthetic-document fine-tuning about lab graders, then RL on two lab-pair environments: code for the write-up experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chz",
    "datasets>=5.0.1",
    "faker>=40",
    "fastapi>=0.142.2",
    "huggingface-hub>=1.33.0",
    "inspect-ai>=0.3.273",
    "jinja2>=3.1.6",
    "langdetect",
    "matplotlib>=3.11.2",
    "nltk",
    "numpy",
    "openai>=1.0",
    "pyarrow",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "reasoning-gym>=0.1.25",
    "tinker>=0.31.0",
    "tinker-cookbook",
    "torch",
    "tqdm>=4.70.1",
    "transformers>=5.3.0",
    "uvicorn>=0.54.0",
    "verifiable-instructions",
    "wandb>=0.30.0",
]

[tool.uv.sources]
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook.git", rev = "aae0cc3fc7b7f564e3790810df72e638ee533978" }
verifiable-instructions = { git = "https://github.com/abukharin-nv/verifiable-instructions.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grader_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
